name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finscope
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: finscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finscope -d finscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      JWT_SECRET: test-secret-not-for-production-32ch
      DATA_MODE: live
      DATABASE_URL: postgresql+psycopg://finscope:change-me@localhost:5432/finscope
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: 安装后端依赖
        working-directory: backend
        run: uv sync --extra dev --frozen
      - name: 检查 Python
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
          uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 检查前端
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run typecheck
