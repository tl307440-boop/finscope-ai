server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # 静态资源压缩：官方 nginx 镜像默认不开 gzip，2 MB 级的 JS 会原样下发。
    # 不含 text/event-stream：AI 助手的流式响应不能被缓冲压缩。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # AI 助手发消息接口：SSE 流式响应。必须写在 /api/ 之前（正则优先于前缀匹配）。
    # 后端已回 X-Accel-Buffering: no，这里再显式关一次，避免有人删掉响应头后回退；
    # 读超时放宽到 180 秒：模型单次最长 60 秒、回合最长 150 秒，事件间隔可能超过默认的 60 秒。
    location ~ ^/api/v1/assistant/sessions/[^/]+/messages$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Vite 构建产物文件名带内容哈希：内容变了文件名就变，所以可以缓存一年且不再回源校验。
    # 找不到就 404，不能回退到 index.html（否则过期的 chunk 会被当成 HTML 解析而报语法错误）。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口页永远重新校验，发版后用户才能立刻拿到指向新哈希文件的 index.html。
    # SPA 回退（try_files 落到 /index.html）也会命中这条精确匹配。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
