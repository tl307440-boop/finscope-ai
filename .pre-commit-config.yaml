repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check .
        language: system
        pass_filenames: false
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format --check .
        language: system
        pass_filenames: false
        files: ^backend/
      - id: frontend-typecheck
        name: frontend typecheck
        entry: npm --prefix frontend run typecheck
        language: system
        pass_filenames: false
        files: ^frontend/
