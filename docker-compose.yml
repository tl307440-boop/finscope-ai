name: finscope-ai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finscope
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: finscope
    ports:
      - "${FINSCOPE_DB_PORT:-5432}:5432"
    volumes:
      - finscope_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finscope -d finscope"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:8000
      FRONTEND_ORIGIN: http://localhost:5173,http://localhost:8080
      DATABASE_URL: postgresql+psycopg://finscope:change-me@db:5432/finscope
      JWT_SECRET: replace-with-long-random-secret
      DATA_MODE: live
      LOG_LEVEL: INFO
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "5"
      WORKER_HEARTBEAT_TTL_SECONDS: "30"
      # 只读已入库的官方披露公告（巨潮资讯 / SEC），不接入媒体新闻
      ENABLE_NEWS: "true"
      FRED_API_KEY: ${FRED_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-FinScopeAI research-admin@example.com}
    ports:
      - "${FINSCOPE_API_PORT:-8000}:8000"
    volumes:
      - finscope_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://finscope:change-me@db:5432/finscope
      JWT_SECRET: replace-with-long-random-secret
      DATA_MODE: live
      LOG_LEVEL: INFO
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "5"
      WORKER_HEARTBEAT_TTL_SECONDS: "30"
      FRED_API_KEY: ${FRED_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-FinScopeAI research-admin@example.com}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - finscope_uploads:/app/data/uploads
    command: ["python", "-m", "app.workers.main"]

  # 可选：任务调度器（规格书 §11）。它只按幂等标识往 sync_jobs 写 queued 记录，不执行任务，
  # 所以要不要随 compose 一起拉起由你决定：需要定时登记任务时再取消下面整段的注释。
  # 语义说明：本段与 worker 用同一个镜像、同一个上传卷；调度器停了不影响 worker 取走已排队任务，
  # worker 停了调度器也只会继续排队（任务不会丢，恢复后照旧执行）。两者共用 finscope_uploads。
  # scheduler:
  #   build:
  #     context: ./backend
  #   environment:
  #     APP_ENV: development
  #     DATABASE_URL: postgresql+psycopg://finscope:change-me@db:5432/finscope
  #     JWT_SECRET: replace-with-long-random-secret
  #     DATA_MODE: live
  #     LOG_LEVEL: INFO
  #     SCHEDULER_TIMEZONE: Asia/Shanghai
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   volumes:
  #     - finscope_uploads:/app/data/uploads
  #   command: ["python", "-m", "app.workers.scheduler"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FINSCOPE_WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  finscope_pg:
  finscope_uploads:
