name: finscope-ai

# 生产编排：只使用预构建镜像（由 GitHub Actions 构建并经 SSH 传到服务器），服务器上不 build、不访问 Docker Hub。
# 镜像标签由 deploy.sh 写入 .release.env 的 IMAGE_TAG。密钥只放服务器上的 .env，不入库。

x-app-env: &app-env
  env_file:
    - .env
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: finscope
      POSTGRES_PASSWORD: ${FINSCOPE_DB_PASSWORD:?请在 .env 里设置 FINSCOPE_DB_PASSWORD}
      POSTGRES_DB: finscope
    # 不映射端口：数据库只在 compose 内网可达。
    volumes:
      - finscope_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finscope -d finscope"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *app-env
    image: finscope-backend:${IMAGE_TAG:?缺少 IMAGE_TAG}
    environment:
      DATABASE_URL: postgresql+psycopg://finscope:${FINSCOPE_DB_PASSWORD}@db:5432/finscope
    volumes:
      - finscope_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *app-env
    image: finscope-backend:${IMAGE_TAG}
    environment:
      DATABASE_URL: postgresql+psycopg://finscope:${FINSCOPE_DB_PASSWORD}@db:5432/finscope
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - finscope_uploads:/app/data/uploads
    command: ["python", "-m", "app.workers.main"]

  scheduler:
    <<: *app-env
    image: finscope-backend:${IMAGE_TAG}
    environment:
      DATABASE_URL: postgresql+psycopg://finscope:${FINSCOPE_DB_PASSWORD}@db:5432/finscope
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - finscope_uploads:/app/data/uploads
    command: ["python", "-m", "app.workers.scheduler"]

  frontend:
    image: finscope-frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${FINSCOPE_WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  finscope_pg:
  finscope_uploads:
