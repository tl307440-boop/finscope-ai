[project]
name = "finscope-ai"
version = "0.1.0"
description = "FinScope AI 金融投研辅助平台"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: 需要可连接的 PostgreSQL，连不上时跳过",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*"]
ignore_missing_imports = true
