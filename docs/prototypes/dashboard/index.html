<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能投研驾驶舱 · 原型</title>
<script src="../../../frontend/node_modules/echarts/dist/echarts.min.js"></script>
<script>window.echarts || document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"><\/script>')</script>
<script src="snapshot.js"></script>
<style>
:root{
  --bg:#070d19;--panel:#0d1729;--panel-top:#111f37;--panel-soft:#13213a;--panel-deep:#091222;--panel-raise:#1a2b49;
  --text:#e6edf8;--text-strong:#f5f8fd;--muted:#94a4be;--faint:#5d6d88;
  --accent:#3b82f6;--accent-soft:rgb(59 130 246/14%);--cyan:#22d3ee;--violet:#a78bfa;--orange:#fb923c;
  --ok:#34d399;--warn:#fbbf24;--danger:#f87171;--rise:#f6465d;--fall:#1fc37d;
  --line:rgb(96 140 220/16%);--line-soft:rgb(96 140 220/8%);--edge-light:rgb(120 170 255/34%);
  --gap:14px;--radius:10px;
  --font-num:"Bahnschrift","DIN Alternate","Roboto Mono","Segoe UI",sans-serif;
  --font-ui:"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);color:var(--text);line-height:1.5;
  background:radial-gradient(1200px 520px at 70% -10%,rgb(37 99 235/14%),transparent 70%),radial-gradient(800px 400px at -10% 110%,rgb(34 211 238/5%),transparent 70%),var(--bg);background-attachment:fixed;font-size:13px}
.page{max-width:1760px;margin:0 auto;padding:18px 22px 28px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.up{color:var(--rise)}.down{color:var(--fall)}.flat{color:var(--muted)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
header.top{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
header.top h1{margin:0;font-size:24px;font-weight:700;color:var(--text-strong)}
header.top .sub{color:var(--muted)}
header.top .right{margin-left:auto;display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.warn{background:var(--warn)}
.card{position:relative;background:linear-gradient(180deg,var(--panel-top),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.card::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--tone,var(--edge-light)),transparent)}
.card:hover{border-color:rgb(96 140 220/28%)}
.card.clickable{cursor:pointer}
.head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.head h2{margin:0;font-size:15px;font-weight:600;color:var(--text-strong)}
.head .icon{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:13px;background:color-mix(in srgb,var(--tone,var(--accent)) 16%,transparent);color:var(--tone,var(--accent))}
.head .sub{color:var(--muted);font-size:13px}
.head .more{margin-left:auto;color:var(--muted);font-size:13px;text-decoration:none;cursor:pointer;white-space:nowrap}
.head .more:hover{color:var(--accent)}
.info{display:inline-grid;place-items:center;width:15px;height:15px;border:1px solid var(--faint);border-radius:50%;font-size:10px;color:var(--muted);cursor:help}
.tone-cyan{--tone:var(--cyan)}.tone-orange{--tone:var(--orange)}.tone-violet{--tone:var(--violet)}.tone-blue{--tone:var(--accent)}.tone-ok{--tone:var(--ok)}.tone-warn{--tone:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.kpi{min-height:150px}
.kpi .big{font-family:var(--font-num);font-size:30px;font-weight:600;color:var(--text-strong);line-height:1.1}
.kpi .big small{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.kpi .caption{color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:6px}
.kv{display:flex;gap:8px;align-items:baseline;margin:2px 0}
.kv .k{color:var(--muted);min-width:84px}
.kv .v{font-size:17px;font-weight:600}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.tempbar{position:relative;height:8px;border-radius:5px;margin:12px 0 6px;background:linear-gradient(90deg,#1e3a8a,#3b82f6 30%,#94a3b8 50%,#fb923c 72%,#f6465d)}
.tempbar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:#fff;box-shadow:0 0 8px #fff;transform:translateX(-50%)}
.factor-line{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.factor-line b{font-family:var(--font-num);font-weight:600;margin-left:4px}
.main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--gap)}
.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);padding:3px 10px;cursor:pointer;font:inherit;font-size:12px}
.seg button.on{background:var(--accent);color:#fff}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:8px}
.chip{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel-deep);cursor:pointer;text-align:left;color:var(--text);font:inherit}
.chip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:color-mix(in srgb,var(--accent) 10%,var(--panel-deep))}
.chip .n{font-size:12px;color:var(--muted)}
.chip .p{font-family:var(--font-num);font-size:17px;font-weight:600}
.chip .c{font-family:var(--font-num);font-size:12.5px;margin-left:6px}
.index-body{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px}
#chartIndex{height:360px}
.overview{border-left:1px solid var(--line-soft);padding-left:12px;font-size:13px}
.overview h3,.sec-title{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.ov-row{display:flex;justify-content:space-between;padding:3.5px 0;border-bottom:1px dashed var(--line-soft)}
.ov-row span:last-child{font-family:var(--font-num)}
.stack-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0 4px}
.stack-bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-weight:500;text-align:left;padding:6px 6px;background:color-mix(in srgb,var(--text) 5%,transparent);white-space:nowrap}
td{padding:6px 6px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
td.r,th.r{text-align:right}
td .sub{color:var(--faint);font-size:11.5px}
tr:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.ellipsis{overflow:hidden;text-overflow:ellipsis;max-width:220px;display:inline-block;vertical-align:bottom}
.heat{display:inline-block;min-width:34px;text-align:center;border-radius:4px;padding:1px 6px;font-family:var(--font-num);font-weight:600;color:#fff}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11.5px;line-height:18px;margin-right:4px;background:var(--accent-soft);color:var(--accent)}
.tag.rise{background:rgb(246 70 93/14%);color:var(--rise)}
.tag.fall{background:rgb(31 195 125/14%);color:var(--fall)}
.tag.warn{background:rgb(251 191 36/12%);color:var(--warn)}
.tag.violet{background:rgb(167 139 250/14%);color:var(--violet)}
.tag.muted{background:rgb(148 164 190/10%);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--panel-deep);border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-num);font-size:22px;font-weight:700;color:var(--text-strong)}
.tile .d{font-family:var(--font-num);font-size:12px;color:var(--accent)}
.tile .p{font-size:11px;color:var(--faint)}
.gauge{margin-top:12px}
.gauge .lab{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.gauge .lab b{font-weight:600}
.gauge .lab .num{margin-left:auto;font-size:15px;font-weight:600;color:var(--text-strong)}
.gauge .track{position:relative;height:8px;border-radius:5px}
.gauge .track i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--panel);box-shadow:0 0 0 1px #fff,0 0 10px rgb(255 255 255/50%);transform:translateX(-50%)}
.gauge .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:4px}
.assets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.asset{font-size:12px;background:var(--panel-deep);border-radius:6px;padding:5px 8px;border:1px solid var(--line-soft)}
.asset .num{font-size:13px}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{background:none;border:0;color:var(--muted);padding:4px 0 7px;font:inherit;font-size:13.5px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text-strong);border-color:var(--accent);font-weight:600}
.empty{color:var(--muted);padding:16px 4px;line-height:1.7}
.empty b{color:var(--warn)}
.note{color:var(--faint);font-size:11.5px;margin-top:6px;line-height:1.6}
.flame{letter-spacing:-2px}
.flame .on{color:var(--orange)}.flame .off{color:#334155}
footer{display:flex;gap:16px;align-items:center;margin-top:14px;padding-top:10px;border-top:1px solid var(--line-soft);color:var(--faint);font-size:12px;flex-wrap:wrap}
footer .right{margin-left:auto}
.modal-mask{position:fixed;inset:0;background:rgb(2 6 15/72%);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 16px}
.modal-mask.show{display:flex}
.modal{width:min(1100px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.modal h2{margin:0 0 4px;font-size:18px;color:var(--text-strong)}
.modal .close{float:right;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 10px;cursor:pointer}
.modal .formula{background:var(--panel-deep);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;font-family:Consolas,var(--font-num);font-size:12.5px;color:#cbd5e1;white-space:pre-wrap;line-height:1.7;margin:10px 0}
.modal .charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.modal .chart{height:260px;background:var(--panel-deep);border-radius:8px;border:1px solid var(--line-soft)}
.contrib{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle}
.banner{border:1px dashed rgb(251 191 36/40%);color:var(--warn);background:rgb(251 191 36/6%);border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:var(--gap)}
@media (max-width:1280px){.main{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.kpis,.grid-2,.tiles,.chips{grid-template-columns:1fr 1fr}.index-body{grid-template-columns:1fr}.overview{border:0;padding:0}}
</style>
</head>
<body>
<main class="page" id="app">
  <header class="top">
    <h1>智能投研驾驶舱</h1>
    <span class="sub">快速把握今日市场大况：全球流动性 · A股温度 · 指数 · 热点 · 自选 · 公告</span>
    <span class="right" id="topStatus"></span>
  </header>
  <div class="banner" id="banner"></div>

  <section class="kpis">
    <article class="card kpi tone-cyan clickable" id="kpiMacro"></article>
    <article class="card kpi tone-orange clickable" id="kpiTemp"></article>
    <article class="card kpi tone-orange clickable" id="kpiHot"></article>
    <article class="card kpi tone-blue" id="kpiWatch"></article>
  </section>

  <section class="main">
    <div class="col">
      <article class="card tone-blue" id="indexCard">
        <div class="head">
          <span class="icon">▤</span><h2>A股主要指数走势</h2>
          <span class="info" title="K线：腾讯日K（不复权）；均线、成交额柱、振幅均由日线现算。分时：腾讯分钟线，纵轴为相对昨收涨跌幅。周K/月K 由日K按自然周/月聚合。">i</span>
          <span class="more" style="cursor:default"><span class="seg" id="periodSeg"></span></span>
        </div>
        <div class="chips" id="indexChips"></div>
        <div class="index-body">
          <div id="chartIndex"></div>
          <aside class="overview" id="indexOverview"></aside>
        </div>
      </article>
      <div class="grid-2">
        <article class="card tone-orange" id="sectorCard"></article>
        <article class="card tone-orange" id="stockCard"></article>
      </div>
    </div>
    <div class="col">
      <article class="card tone-cyan" id="macroCard"></article>
      <article class="card tone-blue" id="watchCard"></article>
      <article class="card tone-warn" id="annCard"></article>
    </div>
  </section>

  <footer id="footer"></footer>
</main>

<div class="modal-mask" id="modalMask"><div class="modal" id="modal"></div></div>

<script>
"use strict";
const S = window.SNAPSHOT || {};
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------------- 基础工具 ---------------- */
const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));
const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length;
const r1 = (v) => Math.round(v * 10) / 10;
const r2 = (v) => Math.round(v * 100) / 100;
const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const signed = (v, d = 2, suf = "%") => !isNum(v) ? "—" : `${v > 0 ? "+" : ""}${v.toFixed(d)}${suf}`;
const cls = (v) => !isNum(v) ? "flat" : v > 0 ? "up" : v < 0 ? "down" : "flat";
const fmt = (v, d = 2) => !isNum(v) ? "—" : v.toLocaleString("zh-CN", { minimumFractionDigits: d, maximumFractionDigits: d });
const yi = (yuan) => !isNum(yuan) ? "—" : yuan >= 1e12 ? `${(yuan / 1e12).toFixed(2)} 万亿` : `${(yuan / 1e8).toFixed(yuan >= 1e10 ? 0 : 2)} 亿`;
const pctChg = (last, prev) => isNum(last) && isNum(prev) && prev !== 0 ? (last / prev - 1) * 100 : null;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lastOf = (xs) => xs && xs.length ? xs[xs.length - 1] : null;
const unavailable = (what) => `<div class="empty"><b>不可用</b>：${esc(what)}</div>`;
const sourceErr = (key) => (S.errors || []).find((e) => e.block === key || e.block.startsWith(key + "."));

function spark(points, { w = 90, h = 26, color = css("--accent"), area = false } = {}) {
  if (!points || points.length < 2) return "";
  const lo = Math.min(...points), hi = Math.max(...points), span = hi - lo || 1;
  const xy = points.map((p, i) => [(i / (points.length - 1)) * w, h - 2 - ((p - lo) / span) * (h - 4)]);
  const d = xy.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join("");
  const fill = area ? `<path d="${d}L${w},${h}L0,${h}Z" fill="${color}" opacity=".14"/>` : "";
  const [lx, ly] = xy[xy.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${fill}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${lx}" cy="${ly}" r="2.4" fill="${color}"/></svg>`;
}
function flames(n, max = 3) {
  return `<span class="flame">${Array.from({ length: max }, (_, i) => `<span class="${i < n ? "on" : "off"}">🔥</span>`).join("")}</span>`;
}
function heatColor(v) { return v >= 80 ? "#dc2626" : v >= 65 ? "#ea580c" : v >= 50 ? "#d97706" : "#475569"; }

/* 序列工具：[[date, value]] */
function valueOnOrBefore(series, date) {
  let found = null;
  for (const [d, v] of series) { if (d <= date) found = v; else break; }
  return found;
}
function nAgo(series, n) { return series.length > n ? series[series.length - 1 - n] : null; }

/* ---------------- 两市成交额（腾讯日K 字段 6，单位万元） ---------------- */
function marketAmounts() {
  const sh = S.klines?.sh000001, sz = S.klines?.sz399001;
  if (!sh || !sz) return null;
  const szMap = new Map(sz.map((r) => [r[0], r[6]]));
  return sh.filter((r) => isNum(r[6]) && isNum(szMap.get(r[0]))).map((r) => [r[0], (r[6] + szMap.get(r[0])) * 1e4]);
}

/* =====================================================================
 * 一、A股市场温度 market-temperature-v2
 * 保留现有 v1 的四因子结构与权重（趋势30% 广度35% 活跃20% 波动15%），输入全部换成全市场数据。
 * ===================================================================== */
function computeTemperature() {
  const out = { factors: [], missing: [] };
  const fb = S.fenbu?.buckets;
  // ---- 广度 35% ----
  if (fb) {
    let up = 0, down = 0, strong = 0, weak = 0;
    for (const [k, n] of Object.entries(fb)) {
      const key = Number(k);
      if (key > 0) up += n; if (key < 0) down += n;
      if (key >= 4) strong += n; if (key <= -4) weak += n;
    }
    const flat = fb["0"] || 0, total = up + down + flat;
    const lu = fb["11"] || 0, ld = fb["-11"] || 0;
    const a = (up / (up + down)) * 100;
    const b = clamp(50 + ((strong - weak) / total) * 250);
    const c = lu + ld > 0 ? (lu / (lu + ld)) * 100 : 50;
    const score = 0.5 * a + 0.25 * b + 0.25 * c;
    Object.assign(out, { up, down, flat, total, lu, ld, strong, weak });
    out.factors.push({ code: "breadth", label: "广度", weight: 0.35, score,
      raw: `上涨 ${up} / 下跌 ${down} / 平 ${flat}（共 ${total}）；涨>3% ${strong} 家，跌>3% ${weak} 家；涨停 ${lu}，跌停 ${ld}`,
      formula: `0.5×上涨占比(${r1(a)}) + 0.25×强弱差分(${r1(b)}) + 0.25×涨跌停比(${r1(c)})` });
  } else out.missing.push("广度（涨跌分布不可用）");

  // ---- 活跃度 20% ----
  const amts = marketAmounts();
  const zt = S.pools?.zt?.rows?.length, zb = S.pools?.zb?.rows?.length;
  if (amts && amts.length >= 21) {
    const today = lastOf(amts)[1];
    const base = mean(amts.slice(-21, -1).map((r) => r[1]));
    const ratio = today / base;
    const volScore = clamp(50 + (ratio - 1) * 125);
    let seal = null, sealScore = null, score = volScore;
    if (isNum(zt) && isNum(zb) && zt + zb > 0) {
      seal = (zt / (zt + zb)) * 100; sealScore = clamp((seal - 40) * 2);
      score = 0.7 * volScore + 0.3 * sealScore;
    }
    Object.assign(out, { amountToday: today, amountBase: base, amountRatio: ratio, seal, zt, zb, amts });
    out.factors.push({ code: "activity", label: "活跃度", weight: 0.20, score,
      raw: `两市成交额 ${yi(today)}，前20日均额 ${yi(base)}，量比 ${ratio.toFixed(3)}；封板率 ${seal === null ? "—" : r2(seal) + "%"}（涨停 ${zt ?? "—"} / 炸板 ${zb ?? "—"}）`,
      formula: `0.7×量能分(${r1(volScore)}) + 0.3×封板率分(${sealScore === null ? "缺" : r1(sealScore)})` });
  } else out.missing.push("活跃度（成交额历史不足 21 日）");

  // ---- 趋势 30%：中证全指 ----
  const kl = S.klines?.sh000985;
  if (kl && kl.length >= 61) {
    const closes = kl.map((r) => r[2]);
    const close = lastOf(closes);
    const ma20 = mean(closes.slice(-20)), ma60 = mean(closes.slice(-60));
    const conds = [close > ma20, close > ma60, ma20 > ma60];
    const state = (conds.filter(Boolean).length / 3) * 100;
    const ret20 = (close / closes[closes.length - 21] - 1) * 100;
    const score = 0.5 * state + 0.5 * clamp(50 + ret20 * 5);
    Object.assign(out, { trendClose: close, ma20, ma60, ret20 });
    out.factors.push({ code: "trend", label: "趋势", weight: 0.30, score,
      raw: `中证全指 ${fmt(close)}，MA20 ${fmt(ma20)}，MA60 ${fmt(ma60)}，20日涨跌 ${signed(ret20)}`,
      formula: `0.5×均线状态(${r1(state)}：${conds.map((c) => (c ? "✓" : "✗")).join("")} 收>MA20/收>MA60/MA20>MA60) + 0.5×clamp(50+20日涨跌%×5)` });
  } else out.missing.push("趋势（中证全指日线不足 61 日）");

  // ---- 波动 15%：中证全指 20日收益波动在近一年的分位 ----
  if (kl && kl.length >= 60) {
    const closes = kl.map((r) => r[2]);
    const rets = closes.slice(1).map((c, i) => c / closes[i] - 1);
    const sd = (xs) => { const m = mean(xs); return Math.sqrt(mean(xs.map((x) => (x - m) ** 2))); };
    const vols = [];
    for (let i = 20; i <= rets.length; i++) vols.push(sd(rets.slice(i - 20, i)));
    const window = vols.slice(-250), current = lastOf(window);
    const rank = window.filter((v) => v <= current).length / window.length;
    const score = clamp(100 - rank * 100);
    Object.assign(out, { vol20: current * Math.sqrt(250) * 100, volRank: rank, volWindows: window.length });
    out.factors.push({ code: "volatility", label: "波动", weight: 0.15, score,
      raw: `20日年化波动 ${r2(current * Math.sqrt(250) * 100)}%，处于近 ${window.length} 个窗口的 ${r1(rank * 100)}% 分位`,
      formula: `100 − 分位×100（波动越处高位，得分越低）` });
  } else out.missing.push("波动（日线不足）");

  const wsum = out.factors.reduce((a, f) => a + f.weight, 0);
  out.score = wsum ? r1(out.factors.reduce((a, f) => a + f.score * f.weight, 0) / wsum) : null;
  out.label = out.score === null ? "无法判断" : out.score >= 80 ? "过热" : out.score >= 65 ? "偏强" : out.score >= 55 ? "中性偏强" : out.score >= 45 ? "中性" : out.score >= 35 ? "中性偏弱" : out.score >= 20 ? "偏弱" : "冰点";
  out.tradeDate = S.fenbu?.qdate;
  return out;
}

/* =====================================================================
 * 二、全球流动性评分 global-liquidity-v1（越高越松）
 * ===================================================================== */
function seriesChange(id, n) {
  const s = S.fred?.[id]; if (!s || s.length <= n) return null;
  return { last: lastOf(s), prev: nAgo(s, n), delta: lastOf(s)[1] - nAgo(s, n)[1] };
}
function computeLiquidity() {
  const f = [], missing = [];
  // L1 美联储净流动性
  const walcl = S.fred?.WALCL, tga = S.fred?.WTREGEN, rrp = S.fred?.RRPONTSYD;
  let netSeries = null;
  if (walcl && tga && rrp) {
    netSeries = walcl.map(([d, v]) => {
      const t = valueOnOrBefore(tga, d), r = valueOnOrBefore(rrp, d);
      return t === null || r === null ? null : [d, (v - t - r * 1000) / 1000];
    }).filter(Boolean);
    if (netSeries.length > 4) {
      const last = lastOf(netSeries), prev = nAgo(netSeries, 4), d = last[1] - prev[1];
      f.push({ code: "fed_net", label: "美联储净流动性 4周变化", weight: 0.25, score: clamp(50 + d / 4),
        raw: `${last[0]} 净流动性 ${fmt(last[1], 0)} 十亿美元，较 ${prev[0]} ${signed(d, 0, " 十亿")}`,
        formula: "净流动性 = WALCL − WTREGEN − RRPONTSYD×1000（百万美元）；得分 = clamp(50 + Δ4周(十亿)/4)", value: d });
    }
  } else missing.push("美联储净流动性");
  const pushDelta = (id, label, weight, mult, unit, scale, sign, desc) => {
    const c = seriesChange(id, 20);
    if (!c) { missing.push(label); return; }
    const delta = unit === "%" ? (c.last[1] / c.prev[1] - 1) * 100 : c.delta * scale;
    f.push({ code: id, label, weight, score: clamp(50 + sign * delta * mult),
      raw: `${c.last[0]} ${c.last[1]} ，较 20 个观测前（${c.prev[0]} ${c.prev[1]}）${signed(delta, unit === "%" ? 2 : 0, unit === "%" ? "%" : " bp")}`,
      formula: desc, value: delta });
  };
  pushDelta("DTWEXBGS", "美元指数(广义) 20期变化", 0.15, 10, "%", 1, -1, "得分 = clamp(50 − 20期涨跌%×10)：美元走强 = 全球美元流动性收紧");
  pushDelta("DFII10", "美债10Y实际利率 20期变化", 0.15, 1, "bp", 100, -1, "得分 = clamp(50 − Δbp×1)：实际利率上行 = 收紧");
  pushDelta("BAMLH0A0HYM2", "美国高收益债利差 20期变化", 0.10, 0.5, "bp", 100, -1, "得分 = clamp(50 − Δbp×0.5)：信用利差走阔 = 收紧");
  const nfci = lastOf(S.fred?.NFCI || []);
  if (nfci) f.push({ code: "NFCI", label: "芝加哥联储金融条件指数", weight: 0.10, score: clamp(50 - nfci[1] * 50),
    raw: `${nfci[0]} NFCI = ${nfci[1]}（负值 = 金融条件宽于历史均值）`, formula: "得分 = clamp(50 − NFCI×50)", value: nfci[1] });
  else missing.push("NFCI");
  const on = S.shibor_on;
  if (on && on.length >= 40) {
    const a = mean(on.slice(-20).map((r) => r[1])), b = mean(on.slice(-40, -20).map((r) => r[1])), d = (a - b) * 100;
    f.push({ code: "shibor", label: "SHIBOR隔夜 20日均值变化", weight: 0.15, score: clamp(50 - d),
      raw: `近20日均值 ${a.toFixed(3)}%，前20日均值 ${b.toFixed(3)}%，变化 ${signed(d, 1, " bp")}；最新 ${lastOf(on)[0]} ${lastOf(on)[1]}%`,
      formula: "得分 = clamp(50 − Δbp)：国内资金价格下行 = 宽松", value: d });
  } else missing.push("SHIBOR");
  const tr = S.treasury;
  if (tr && tr.length > 20) {
    const sp = (r) => (r.cn10y - r.us10y) * 100;
    const last = lastOf(tr), prev = nAgo(tr, 20), d = sp(last) - sp(prev);
    f.push({ code: "cnus", label: "中美10Y利差 20日变化", weight: 0.10, score: clamp(50 + d),
      raw: `${last.date} 中国10Y ${last.cn10y}% − 美国10Y ${last.us10y}% = ${fmt(sp(last), 0)} bp，较 ${prev.date} ${signed(d, 0, " bp")}`,
      formula: "得分 = clamp(50 + Δbp)：倒挂收窄 = 人民币资产外部约束放松", value: d });
  } else missing.push("中美利差");
  const wsum = f.reduce((a, x) => a + x.weight, 0);
  const score = wsum ? r1(f.reduce((a, x) => a + x.score * x.weight, 0) / wsum) : null;
  const label = score === null ? "无法判断" : score >= 65 ? "偏松" : score >= 55 ? "中性偏松" : score >= 45 ? "中性" : score >= 35 ? "中性偏紧" : "偏紧";
  return { factors: f, missing, score, label, netSeries };
}

/* =====================================================================
 * 三、全球经济热度 global-growth-v1 与宏观趋势判定
 * ===================================================================== */
function yoyAt(series, idx) {
  const [d, v] = series[idx];
  const target = `${Number(d.slice(0, 4)) - 1}${d.slice(4, 7)}`;
  const base = series.find(([x]) => x.slice(0, 7) === target);
  return base ? (v / base[1] - 1) * 100 : null;
}
function computeGrowth() {
  const f = [], missing = [];
  const un = S.fred?.UNRATE;
  if (un && un.length > 3) {
    const d = lastOf(un)[1] - nAgo(un, 3)[1];
    f.push({ label: "美国失业率 3个月变化", weight: 0.3, score: clamp(50 - d * 100),
      raw: `${lastOf(un)[0].slice(0, 7)} ${lastOf(un)[1]}%，3个月前 ${nAgo(un, 3)[1]}%，变化 ${signed(d, 2, " pp")}`, formula: "得分 = clamp(50 − Δpp×100)" });
  } else missing.push("失业率");
  const pay = S.fred?.PAYEMS;
  if (pay && pay.length > 3) {
    const adds = [1, 2, 3].map((i) => pay[pay.length - i][1] - pay[pay.length - i - 1][1]);
    const avg = mean(adds);
    f.push({ label: "美国非农近3月平均新增", weight: 0.3, score: clamp(50 + (avg - 100) * 0.25),
      raw: `近3个月新增 ${adds.map((x) => fmt(x, 0)).join(" / ")} 千人，均值 ${fmt(avg, 0)} 千人`, formula: "得分 = clamp(50 + (均值−100)×0.25)" });
  } else missing.push("非农");
  const pmi = S.china_pmi;
  if (pmi && pmi.length) {
    const [d, v] = lastOf(pmi);
    f.push({ label: "中国制造业PMI", weight: 0.4, score: clamp(50 + (v - 50) * 10),
      raw: `${d.slice(0, 7)} PMI ${v}（50 为荣枯线）`, formula: "得分 = clamp(50 + (PMI−50)×10)" });
  } else missing.push("中国PMI");
  const wsum = f.reduce((a, x) => a + x.weight, 0);
  const score = wsum ? r1(f.reduce((a, x) => a + x.score * x.weight, 0) / wsum) : null;
  const label = score === null ? "无法判断" : score >= 60 ? "偏热" : score >= 45 ? "中性" : "偏冷";
  // 通胀动能：CPI 同比与 3 个月前同比之差
  let inflMomentum = null, cpiYoy = null, cpiPrevYoy = null;
  const cpi = S.fred?.CPIAUCSL;
  if (cpi && cpi.length > 16) {
    cpiYoy = yoyAt(cpi, cpi.length - 1); cpiPrevYoy = yoyAt(cpi, cpi.length - 2);
    const y3 = yoyAt(cpi, cpi.length - 4);
    if (cpiYoy !== null && y3 !== null) inflMomentum = cpiYoy - y3;
  }
  let regime = "无法判断";
  if (score !== null && inflMomentum !== null) {
    if (score >= 55) regime = inflMomentum > 0 ? "扩张伴随通胀升温" : "温和扩张";
    else if (score <= 45) regime = inflMomentum > 0 ? "滞胀压力" : "增长放缓";
    else regime = inflMomentum > 0.2 ? "通胀回升" : inflMomentum < -0.2 ? "平稳降温" : "平稳";
  }
  return { factors: f, missing, score, label, inflMomentum, cpiYoy, cpiPrevYoy, regime };
}

/* =====================================================================
 * 四、热点板块：热度指数 board-heat-v1
 * ===================================================================== */
function computeBoards() {
  const ths = [...(S.ths_concept || []).map((x) => ({ ...x, kind: "概念" })), ...(S.ths_industry || []).map((x) => ({ ...x, kind: "行业" }))];
  if (!ths.length) return null;
  const maxHeat = Math.max(...ths.map((x) => x.heat || 0)) || 1;
  const changes = ths.map((x) => x.change_pct).filter(isNum).sort((a, b) => a - b);
  const pctRank = (v) => (changes.filter((c) => c <= v).length / changes.length) * 100;
  const rows = ths.map((x) => {
    const m = /(\d+)家涨停/.exec(x.tag || "");
    const limitUps = m ? Number(m[1]) : 0;
    const heatScore = ((x.heat || 0) / maxHeat) * 100;
    const changeScore = isNum(x.change_pct) ? pctRank(x.change_pct) : 0;
    const luScore = Math.min(limitUps / 10, 1) * 100;
    const index = 0.4 * heatScore + 0.3 * changeScore + 0.3 * luScore;
    const leader = (S.sina_concept || []).concat(S.sina_industry || []).find((s) => s.name === x.name);
    return { ...x, limitUps, heatScore, changeScore, luScore, index: Math.round(index), leader };
  }).sort((a, b) => b.index - a.index);
  const hot = rows.filter((r) => r.index >= 60 && (r.change_pct ?? 0) >= 1);
  return { rows, hot };
}

/* =====================================================================
 * 五、公告：重要度与热度
 * ===================================================================== */
const ANN_RULES = [
  ["质押", 1, "muted", /质押/],
  ["风险", 3, "fall", /立案|处罚|警示函|退市|风险警示|终止上市|违规|司法冻结|重大诉讼|仲裁/],

  ["业绩", 3, "rise", /业绩预告|业绩快报|预增|预减|扭亏|首亏/],
  ["定期报告", 2, "", /第三季度报告|季度报告|半年度报告|年度报告/],
  ["问询", 2, "warn", /问询函|关注函|监管函|监管工作函/],
  ["增持回购", 2, "rise", /回购|增持/],
  ["减持", 2, "fall", /减持/],
  ["合同订单", 2, "", /中标|重大合同|签订.*(合同|协议)|项目定点/],
  ["分红", 1, "", /分红|权益分派|利润分配/],
  ["股权激励", 1, "", /股权激励|员工持股/],
];
/* 附属文件（中介意见、评估报告、董事会说明等）一律不计重要度，避免一个事件刷屏 */
const ANN_ROUTINE = /法律意见书|核查意见|评估报告|审计报告|审阅报告|董事会关于|监事会关于|的说明|董事会决议|监事会决议|独立董事|会议资料|提示性公告|投资者关系|调研活动|章程|制度|保荐|专项说明|摘要|英文版/;
function classifyAnn(a) {
  const title = a.title || "";
  if (ANN_ROUTINE.test(title)) return { type: a.column || "常规", level: 0, tone: "muted" };
  // 只匹配标题：东财栏目名是复合词（如「股份质押、冻结」），拿来匹配会误判
  for (const [type, level, tone, re] of ANN_RULES) if (re.test(title)) return { type, level, tone };
  return { type: a.column || "其他", level: 0, tone: "muted" };
}
function cleanTitle(a) {
  let t = a.title || "";
  for (const part of [a.code, a.name]) if (part && t.startsWith(part)) t = t.slice(part.length);
  t = t.replace(/^[\s:：]+/, "");
  if (a.name && t.startsWith(a.name)) t = t.slice(a.name.length).replace(/^[\s:：]+/, "");
  return a.name ? `${a.name}：${t}` : t;
}
/* 同一股票同一类型只保留一条（最短标题通常是主公告） */
function dedupeAnn(rows) {
  const best = new Map();
  for (const a of rows) {
    const key = `${a.code}|${a.type}`, cur = best.get(key);
    if (!cur || a.title.length < cur.title.length) best.set(key, a);
  }
  return [...best.values()];
}
function stockHeatMap() {
  const map = new Map();
  const bump = (code, v, why) => { const cur = map.get(code); if (!cur || cur.v < v) map.set(code, { v, why }); };
  (S.ths_hot || []).forEach((h) => bump(h.code, h.rank <= 20 ? 3 : 2, `同花顺热榜第${h.rank}`));
  (S.pools?.zt?.rows || []).forEach((r) => bump(r.code, 1, r.streak > 1 ? `${r.streak}连板` : "涨停"));
  (S.pools?.dt?.rows || []).forEach((r) => bump(r.code, 1, "跌停"));
  (S.gainers || []).slice(0, 40).forEach((g) => bump(g.code, 1, "涨幅榜前40"));
  return map;
}

    const d5 = closes.length > 5 ? (closes[closes.length - 1] / closes[closes.length - 6] - 1) * 100 : null;
    const state = d5 === null ? "震荡" : d5 >= 3 ? "强势" : d5 <= -3 ? "弱势" : "震荡";
    const zt = (S.pools?.zt?.rows || []).find((r) => r.code === w.code);
    const zb = (S.pools?.zb?.rows || []).find((r) => r.code === w.code);
    const dt = (S.pools?.dt?.rows || []).find((r) => r.code === w.code);
    const hot = (S.ths_hot || []).find((h) => h.code === w.code);
    const signals = [];
    if (zt) signals.push(["rise", zt.streak > 1 ? `${zt.streak}连板` : "涨停"]);
    if (zb) signals.push(["warn", "炸板"]);
    if (dt) signals.push(["fall", "跌停"]);
    if (hot) signals.push(["violet", `热榜#${hot.rank}`]);
    if (Math.abs(d1 ?? 0) >= 5 && !zt && !dt) signals.push([d1 > 0 ? "rise" : "fall", "异动"]);
    return { ...w, d1, d5, state, closes, signals };
  });
}

function factorTable(factors) {
  const wsum = factors.reduce((a, f) => a + f.weight, 0) || 1;
  return `<table><thead><tr><th>因子</th><th class="r">权重</th><th>原始数据</th><th>换算</th><th class="r">得分</th><th class="r">贡献</th></tr></thead><tbody>
  ${factors.map((f) => { const c = (f.score * f.weight) / wsum; return `<tr><td><b>${f.label}</b></td><td class="r num">${(f.weight * 100).toFixed(0)}%</td><td style="white-space:normal;max-width:380px">${esc(f.raw)}</td><td style="white-space:normal;max-width:300px" class="muted">${esc(f.formula)}</td><td class="r num">${r1(f.score)}</td><td class="r num"><span class="contrib" style="width:${c}px"></span> ${r1(c)}</td></tr>`; }).join("")}</tbody></table>`;
}
